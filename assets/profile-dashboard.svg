<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Manvendra Singh developer profile dashboard</title>
<desc id="desc">A dark navy dashboard highlighting 17 public repositories and focus areas in full-stack development, AI and machine learning, and software engineering.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#101f35"/><stop offset="1" stop-color="#082f49"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="340" rx="24" fill="url(#bg)"/>
<circle cx="1070" cy="55" r="145" fill="#0ea5e9" opacity=".08"/>
<circle cx="1080" cy="50" r="95" fill="none" stroke="#38bdf8" stroke-opacity=".18"/>
<path d="M0 270 Q300 210 560 280 T1200 235 V340 H0Z" fill="#0ea5e9" opacity=".06"/>
<text x="52" y="62" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">DEVELOPER SNAPSHOT</text>
<text x="52" y="118" fill="#f8fafc" font-family="Arial,sans-serif" font-size="37" font-weight="700">Building ideas into useful software.</text>
<text x="52" y="153" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="18">Full-stack development  ·  AI / ML  ·  Software engineering</text>
<rect x="52" y="195" width="250" height="104" rx="16" fill="#0f2439" stroke="#38bdf8" stroke-opacity=".38"/>
<text x="76" y="230" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">PUBLIC REPOSITORIES</text>
<text x="76" y="278" fill="#ffffff" font-family="Arial,sans-serif" font-size="40" font-weight="700">17</text>
<rect x="324" y="195" width="250" height="104" rx="16" fill="#0f2439" stroke="#38bdf8" stroke-opacity=".25"/>
<text x="348" y="230" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">FEATURED BUILDS</text>
<text x="348" y="278" fill="#ffffff" font-family="Arial,sans-serif" font-size="40" font-weight="700">04</text>
<text x="632" y="213" fill="#f8fafc" font-family="Arial,sans-serif" font-size="17" font-weight="700">CURRENT INTERESTS</text>
