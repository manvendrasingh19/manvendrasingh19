<rect x="632" y="235" width="170" height="38" rx="19" fill="#0e7490" opacity=".55"/><text x="717" y="259" text-anchor="middle">Full-stack apps</text>
<rect x="814" y="235" width="132" height="38" rx="19" fill="#1d4ed8" opacity=".45"/><text x="880" y="259" text-anchor="middle">AI / ML</text>
<rect x="958" y="235" width="190" height="38" rx="19" fill="#155e75" opacity=".65"/><text x="1053" y="259" text-anchor="middle">Computer vision</text>
</g>
<rect x="632" y="292" width="516" height="3" rx="2" fill="#164e63"/>
<rect x="632" y="292" width="330" height="3" rx="2" fill="url(#cyan)" filter="url(#glow)"/>
<text x="52" y="322" fill="#94a3b8" font-family="Arial,sans-serif" font-size="11">MANVENDRA SINGH  •  COMPUTER SCIENCE &amp; ENGINEERING</text>
